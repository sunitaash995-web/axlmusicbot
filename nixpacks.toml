# Railway (Nixpacks) needs ffmpeg AND ffprobe for py-tgcalls audio processing
[phases.setup]
nixPkgs = ["ffmpeg", "wget", "xz"]

[phases.install]
cmds = [
    # Download static ffmpeg + ffprobe (includes both binaries)
    "wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -O /tmp/ffmpeg.tar.xz",
    "tar -xf /tmp/ffmpeg.tar.xz -C /tmp",
    "cp /tmp/ffmpeg-*-amd64-static/ffmpeg /tmp/ffmpeg-*-amd64-static/ffprobe /usr/local/bin/",
    "chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe",
    "ffmpeg -version | head -1",
    "ffprobe -version | head -1",
]
